name: Animate Enhanced v19.3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/animate-enhanced-v19-3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Animate Enhanced gradient
        run: python .github/scripts/animate_enhanced_v19_3.py

      - name: Validate
        run: |
          node --check script.js
          grep -q '^// @version      19.3$' script.js
          grep -q 'animation:ep-enhanced-gradient' script.js
          grep -q '@keyframes ep-enhanced-gradient' script.js
          grep -q 'prefers-reduced-motion: reduce' script.js
          if grep -q '^// @require' script.js; then
            echo 'script.js must remain standalone'
            exit 1
          fi

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "Animate Enhanced gradient in v19.3" || exit 0
          git push
