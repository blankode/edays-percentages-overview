name: Change navigation labels only

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/change-nav-labels-only.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Change only navigation labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          old = "const label = target === 'today' ? 'To today' : 'Back to top';"
          new = "const label = target === 'today' ? '↓ To today' : '↑ To home';"
          if old not in s:
              raise SystemExit('Expected 19.2 label line not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check script.js
          grep -q '^// @version      19.2$' script.js
          grep -q "const label = target === 'today' ? '↓ To today' : '↑ To home';" script.js
          if grep -q '^// @require' script.js; then exit 1; fi

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "Change 19.2 navigation labels only" || exit 0
          git push
