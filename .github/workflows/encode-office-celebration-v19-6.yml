name: Encode original Tenor GIF for userscript
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/encode-office-celebration-v19-6.yml
permissions:
  contents: read
jobs:
  encode:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve and validate original GIF
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,base64,hashlib
          url='https://media.tenor.com/harNA7X24MUAAAAj/congratulations.gif'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'image/gif'})
          with urllib.request.urlopen(req,timeout=30) as r:
              content=r.read(1000001)
              print('FETCH_STATUS',r.status,'CONTENT_TYPE',r.headers.get('Content-Type'))
          assert 50<len(content)<=1000000 and content[:6] in (b'GIF87a',b'GIF89a'), 'Invalid GIF or too large'
          print('GIF_SIZE',len(content),'GIF_SHA256',hashlib.sha256(content).hexdigest())
          print('GIF_DIMENSIONS',int.from_bytes(content[6:8],'little'),int.from_bytes(content[8:10],'little'))
          print('GIF_B64_BEGIN')
          encoded=base64.b64encode(content).decode('ascii')
          for i in range(0,len(encoded),1600):
              print('GIF_CHUNK',encoded[i:i+1600])
          print('GIF_B64_END')
          PY
