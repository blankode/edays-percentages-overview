name: Fix c3 button initial render

on:
  push:
    branches: [main]
    paths:
      - .github/scripts/fix_c3_initial_render.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch userscript
        run: python .github/scripts/fix_c3_initial_render.py
      - name: Validate
        run: |
          node --check script.js
          grep -q '^// @version      19.2$' script.js
          grep -q "button.textContent = getTimesheetNavLabel(target);" script.js
          grep -q "button.replaceWith(createTimesheetNavButton(target));" script.js
          if grep -q "button.textContent.trim() !== label" script.js; then exit 1; fi
          if grep -q '^// @require' script.js; then exit 1; fi
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "Fix native c3-button initial label rendering" || exit 0
          git push
