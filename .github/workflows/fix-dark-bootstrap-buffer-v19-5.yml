name: Fix dark bootstrap and buffer v19.5

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-dark-bootstrap-buffer-v19-5.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch v19.5
        run: python .github/scripts/fix_dark_bootstrap_buffer_v19_5.py

      - name: Validate
        run: |
          node --check script.js
          grep -q '^// @version      19.5$' script.js
          grep -q '^// @run-at       document-start$' script.js
          grep -q 'EP_DARK_BOOTSTRAP_TIMEOUT_MS = 5000' script.js
          grep -q 'ep-buffer-toggle.is-off' script.js
          grep -q 'requestAnimationFrame(clearEarlyDarkBootstrap)' script.js
          if grep -q '^// @require' script.js; then
            echo 'script.js must remain standalone'
            exit 1
          fi

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "Fix dark refresh flash and buffer toggle in v19.5" || exit 0
          git push
