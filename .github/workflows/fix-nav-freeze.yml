name: Fix navigation freeze

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-nav-freeze.yml
      - .github/scripts/fix_nav_freeze.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch standalone userscript
        run: python .github/scripts/fix_nav_freeze.py

      - name: Validate standalone userscript
        run: |
          node --check script.js
          grep -q '^// @version      19.2$' script.js
          grep -q "if (!button.isConnected && button.textContent.trim() !== label)" script.js
          grep -q "if (button.dataset.epTarget !== target)" script.js
          if grep -q "button.dataset.epTarget !== target || button.textContent.trim() !== label" script.js; then
            echo 'Old replacement loop condition still present'
            exit 1
          fi
          if grep -q '^// @require' script.js; then
            echo 'script.js must remain standalone'
            exit 1
          fi

      - name: Commit freeze fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "Fix navigation MutationObserver freeze" || exit 0
          git push
