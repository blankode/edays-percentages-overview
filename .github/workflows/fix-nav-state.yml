name: Fix navigation state switching

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-nav-state.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix standalone userscript navigation state
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('script.js')
          source = path.read_text(encoding='utf-8')

          source = source.replace('// @version      19.3', '// @version      19.2', 1)
          source = re.sub(r'^// Changelog v19\.3:.*\n', '', source, count=1, flags=re.M)
          source = re.sub(r'^// Changelog v19\.2:.*$', '// Changelog v19.2: Unified native timesheet navigation after Submit month with ↓ To today / ↑ To home; removed the separate floating navigation and Today-strip jump action.', source, count=1, flags=re.M)

          source, count = re.subn(r'\n    const getScrollMetrics = element => \{.*?\n    \};\n\n    const updateTimesheetNavButton', '\n    const updateTimesheetNavButton', source, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError('getScrollMetrics block not found')

          old_state = "\n".join([
              "        if (todayRow) {",
              "            const metrics = getScrollMetrics(todayRow);",
              "            const todayReachedAt = Math.max(0, metrics.target - 100);",
              "            target = metrics.current >= todayReachedAt ? 'top' : 'today';",
              "        }",
          ])
          new_state = "\n".join([
              "        if (todayRow) {",
              "            const scrollParent = getScrollParent(todayRow);",
              "            const viewportTop = scrollParent === window",
              "                ? 0",
              "                : scrollParent.getBoundingClientRect().top;",
              "            const todayReachedAt = viewportTop + 110;",
              "            target = todayRow.getBoundingClientRect().top <= todayReachedAt",
              "                ? 'top'",
              "                : 'today';",
              "        }",
          ])
          if old_state not in source:
              raise RuntimeError('Old navigation state block not found')
          source = source.replace(old_state, new_state, 1)

          old_click = "\n".join([
              "                if (button.dataset.epTarget === 'today') {",
              "                    jumpToToday();",
              "                } else {",
              "                    jumpToAnalyzer();",
              "                }",
          ])
          new_click = "\n".join([
              "                if (button.dataset.epTarget === 'today') {",
              "                    jumpToToday();",
              "                    setTimeout(scheduleTimesheetNavUpdate, 350);",
              "                    setTimeout(scheduleTimesheetNavUpdate, 900);",
              "                } else {",
              "                    jumpToAnalyzer();",
              "                    setTimeout(scheduleTimesheetNavUpdate, 350);",
              "                    setTimeout(scheduleTimesheetNavUpdate, 900);",
              "                }",
          ])
          if old_click not in source:
              raise RuntimeError('Navigation click block not found')
          source = source.replace(old_click, new_click, 1)

          path.write_text(source, encoding='utf-8')

      - name: Validate userscript
        run: |
          node --check script.js
          grep -q '^// @version      19.2$' script.js
          ! grep -q '^// Changelog v19.3:' script.js
          grep -q "↓ To today" script.js
          grep -q "↑ To home" script.js
          grep -q "const todayReachedAt = viewportTop + 110;" script.js
          if grep -q '^// @require' script.js; then
            echo 'script.js must remain standalone'
            exit 1
          fi

      - name: Commit fixed standalone script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "Fix To today and To home state" || exit 0
          git push
