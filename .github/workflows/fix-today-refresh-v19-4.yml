name: Fix Today refresh v19.4

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-today-refresh-v19-4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Today refresh ordering
        run: python .github/scripts/fix_today_refresh_v19_4.py

      - name: Validate
        run: |
          node --check script.js
          grep -q '^// @version      19.4$' script.js
          grep -q '^// Changelog v19.4:' script.js
          grep -q 'DarkReader.enable(DARK_READER_THEME, DARK_READER_FIXES);' script.js
          if grep -q '^// @require' script.js; then
            echo 'script.js must remain standalone'
            exit 1
          fi

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "Fix Today styling on dark-mode refresh in v19.4" || exit 0
          git push
