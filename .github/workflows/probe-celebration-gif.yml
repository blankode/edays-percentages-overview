name: Probe celebration GIF source
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-celebration-gif.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test Tenor page and image metadata
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, re, html
          ID='9631736168906678469'
          urls=[f'https://tenor.com/view/congratulations-gif-{ID}',f'https://tenor.com/embed/{ID}',f'https://tenor.com/oembed?url=https%3A%2F%2Ftenor.com%2Fview%2Fcongratulations-gif-{ID}']
          for url in urls:
              print('REQUEST',url,flush=True)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/json'})
                  with urllib.request.urlopen(req,timeout=17) as response:
                      data=response.read(3500000).decode('utf-8','ignore')
                      print('STATUS',response.status,'URL',response.url,'LENGTH',len(data),flush=True)
                  data=html.unescape(data).replace('\\/','/')
                  metas=re.findall(r'<meta[^>]+(?:property|name)=["\x27](?:og:image|twitter:image|og:video)["\x27][^>]+>',data,re.I)
                  print('META',metas[:4])
                  gifs=re.findall(r'https?://[^\s"\x27]+?\.gif(?:\?[^\s"\x27]*)?',data,re.I)
                  print('GIFS',gifs[:12]);print('GIF_COUNT',len(gifs)); print('HAS_POST_ID',ID in data)
                  if len(data)<300: print('BODY_START',data[:300])
              except Exception as e: print('ERROR',repr(e),flush=True)
          PY