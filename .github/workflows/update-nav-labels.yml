name: Update navigation labels

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-nav-labels.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update standalone userscript labels
        shell: python
        run: |
          from pathlib import Path

          path = Path('script.js')
          source = path.read_text(encoding='utf-8')

          source = source.replace('// @version      19.2', '// @version      19.3', 1)

          header_marker = '// ==/UserScript==\n'
          changelog = '// Changelog v19.3: Navigation button now shows ↑ To home when returning upward and ↓ To today when jumping to today.\n'
          if changelog not in source:
              source = source.replace(header_marker, header_marker + changelog, 1)

          old = "const label = target === 'today' ? 'To today' : 'Back to top';"
          new = "const label = target === 'today' ? '↓ To today' : '↑ To home';"
          if old not in source:
              raise RuntimeError('Navigation label line not found')
          source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')

      - name: Validate userscript
        run: |
          node --check script.js
          grep -q '^// @version      19.3$' script.js
          grep -q "↓ To today" script.js
          grep -q "↑ To home" script.js
          if grep -q '^// @require' script.js; then
            echo 'script.js must remain standalone'
            exit 1
          fi

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "Use directional navigation labels" || exit 0
          git push
