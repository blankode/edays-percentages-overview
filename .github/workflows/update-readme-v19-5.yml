name: Update README v19.5

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-readme-v19-5.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update README
        run: python .github/scripts/update_readme_v19_5.py

      - name: Validate
        run: |
          grep -q 'version-19.5-6366f1' README.md
          grep -q '^| \*\*19.5\*\* |' README.md

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README for v19.5" || exit 0
          git push
