name: Vendor Dark Reader v19.3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vendor-darkreader-v19-3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download pinned Dark Reader API
        run: |
          curl -fL https://cdn.jsdelivr.net/npm/darkreader@4.9.133/darkreader.js -o /tmp/darkreader.js
          curl -fL https://cdn.jsdelivr.net/npm/darkreader@4.9.133/LICENSE -o /tmp/darkreader-LICENSE
          test $(wc -c < /tmp/darkreader.js) -gt 250000
          grep -q 'DarkReader' /tmp/darkreader.js

      - name: Vendor Dark Reader and switch theme engine
        run: python .github/scripts/vendor_darkreader_v19_3.py

      - name: Validate standalone userscript
        run: |
          node --check script.js
          grep -q '^// @version      19.3$' script.js
          grep -q 'VENDORED DARK READER API 4.9.133' script.js
          grep -q 'DarkReader.enable(DARK_READER_THEME, DARK_READER_FIXES);' script.js
          grep -q "s.classList.add('darkreader');" script.js
          test $(wc -c < script.js) -gt 400000
          if grep -q "classList.toggle('ep-site-dark'" script.js; then
            echo 'manual dark mode activation still present'
            exit 1
          fi
          if grep -q '^// @require' script.js; then
            echo 'script.js must remain standalone'
            exit 1
          fi

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "Use official Dark Reader engine in v19.3" || exit 0
          git push
